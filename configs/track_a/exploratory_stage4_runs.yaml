# Track A — stage-4 exploratory run plan (TRACK-A-REAL-DATA-READINESS-001, WS7)
#
# ############################################################################
# STAGE 4 IS AUTHORIZED AND HAS BEEN EXECUTED.
#
# Both gates are open:
#   1. the censoring-treatment ruling is ADOPTED by D-010, instrument
#      docs/track_a/CENSORING_TREATMENT_RULING_v1.md (freeze 11.1);
#   2. execution stage 3 has passed for both arms under D-008; run manifests at
#      runs/track_a/stage3/.
#
# The stage-4 execution gate is granted by D-011, which extends D-008 to stage 4
# ONLY. Stages 5 and 6 remain blocked by their sequential gates. Every stage-4
# result is EXPLORATORY and must be labelled so in every table and figure
# (freeze 10).
# ############################################################################

plan_status: EXECUTED
authorized_stage: 4          # granted by D-011; stages 5 and 6 remain blocked
blocked_by: []               # both gates cleared 2026-07-29 (D-010, D-011)

# ############################################################################
# EVENT TRIO — E08 / E14 / E21, PER THE COMMITTED CONTRACT
#
# A substitution of E18 for E21 was proposed on 2026-07-29 and marked
# PROPOSED_PENDING_PI_DECISION. It was PUT TO THE PI AND DECLINED (D-011).
#
# Ground for declining, verified against data/frozen/track_a/v7_demand_censored_v3.csv:
#   E18_20240114  83 h  all unresolved  source_status NOT_RETRIEVED      confidence none
#   E21_20260125  78 h  all unresolved  source_status RETRIEVED_VERIFIED confidence none
#
# The proposal's premise was that E21 is unresolvable while E18 is "resolved".
# The controlling artifact shows both entirely unresolved, with E21 carrying the
# STRONGER recorded provenance of the two. The supporting OE-417 / EIA Appendix B
# evidence appears nowhere in the imported record. Separately, D-010 retains
# unresolved hours in the primary metric and records that censoring state does
# not govern event selection -- which removes the premise entirely, since
# unresolved is the state of 1,191 of 1,271 event-hours including all of E18's.
#
# The committed trio therefore stands unchanged.
# ############################################################################
substitution_status: DECLINED_BY_D-011
substitution_declined_reason: >-
  Contradicted by the controlling censoring artifact and mooted by D-010.
  See docs/project/DECISION_LOG.md D-011 and docs/project/CURRENT_STATE.md.

# Stage 4 is exploratory. Freeze section 10 requires every stage-4 result to be
# labelled exploratory in every table and figure.
result_labelling: EXPLORATORY

# --- Frozen controls inherited from EXPERIMENT_FREEZE_v1.md -----------------
#
# NOTE: horizon, scale_floor, buffer_days, issuance_local_time,
# issuance_calendar_zone and canonical_axis are TRANSCRIPTIONS of module
# constants, kept here for readability. They are NOT read by the runner --
# partition.py and load_data.py are authoritative, and
# tests/track_a/test_frozen_constants.py asserts these values equal them so the
# two cannot drift apart silently.

seeds: [20260729, 20260730, 20260731]   # freeze section 8, all three frozen seeds
context_size: 64             # freeze section 4, headline
horizon: 24                  # freeze section 6
scale_floor: 1.0e-3          # freeze section 6, frozen constant
buffer_days: 7               # freeze section 3, plus/minus 7 days
issuance_local_time: "09:00" # freeze section 5 / D-007, on D-1
issuance_calendar_zone: "America/Chicago"
canonical_axis: "UTC"

# Both arms must consume byte-identical saved context indices (freeze section 4
# and the Track A rules). Selection happens once per episode, outside the model.
shared_context_indices: true

# --- Replication-fidelity axes (D-012, D-013) -------------------------------
#
# Added after docs/track_a/REPLICATION_FIDELITY_v1.md compared this design with
# Hu et al. (arXiv:2602.04609). Each axis is run in BOTH settings so the
# contribution of the deviation is measured rather than assumed.

# D-012 -- temperature features. The paper's PJM inputs include past-day
# temperature and non-linear functions of it; Track A originally had none, while
# defining its events by a temperature quantity. "both" runs the ablation.
feature_sets: [base, temperature]      # base = 29 dims, temperature = 57 dims

# D-013 -- context construction. The paper SAMPLES the context set (Alg. 1/2);
# Track A retrieved the nearest-64. Nearest-neighbour retrieval hands both arms
# a pre-filtered context set, which strengthens the CNP baseline and compresses
# the gap under test. "both" measures that effect.
context_conditions: [nearest, sampled]

# D-014 -- training length. The paper trains ~1000 epochs (its Fig. 4); the
# original Track A runs used 300 optimizer steps and were far from converged.
training_steps: 3000

# --- The six planned runs ---------------------------------------------------
#
# Events are identified by event_id, verified present and load-eligible against
# the imported controlling artifacts by
# tests/track_a/test_event_eligibility.py::test_exploratory_events_exist_and_are_eligible.
# These are IDENTIFIERS, not counts, and assert nothing about inventory size.
# The fold count is derived at run time and never hard-coded (D-006, freeze 10.1).

events:
  - event_id: E08_20110202
    onset_utc: "2011-02-02 04:00:00+00:00"
    recovery_utc: "2011-02-05 22:00:00+00:00"
    declared_event_hours: 91
    verified_shed_hours: 9
    note: >-
      Censoring window W-2011-0202-v3. The window's quoted wording is
      PI-supplied and was not independently read; see the adopted censoring
      ruling section 1.3. Its 9 verified_shed hours are excluded from the
      primary metric under D-010.

  - event_id: E14_20210212
    onset_utc: "2021-02-12 00:00:00+00:00"
    recovery_utc: "2021-02-20 15:00:00+00:00"
    declared_event_hours: 208
    verified_shed_hours: 71
    note: >-
      February 2021. 71 of 208 hours (34%) are verified_shed lower-bound
      observations, excluded from the primary metric under D-010. This event is
      the most censoring-affected in the record; every E14 result must state the
      34% exclusion. A wide sensitivity envelope W-2021-0215-WIDE-v3 exists but
      is NOT_APPLIED.

  - event_id: E21_20260125
    onset_utc: "2026-01-25 03:00:00+00:00"
    recovery_utc: "2026-01-28 08:00:00+00:00"
    declared_event_hours: 78
    verified_shed_hours: 0
    note: >-
      Firm-shed status NOT ESTABLISHED; all 78 hours unresolved, source_status
      RETRIEVED_VERIFIED. The record notes DOE FPA 202(c) Orders 202-26-01A and
      202-26-04, which are supply-side authorities and are not evidence that
      shedding occurred. Unresolved must not be defaulted in either direction,
      and under D-010 these hours are retained in the primary metric, flagged,
      with the limitation disclosed.

arms:
  - name: CNP
    aggregation: uniform_mean
    module: ercot_forecasting.track_a.cnp
  - name: AdaCNP
    aggregation: target_conditioned_adaptive
    module: ercot_forecasting.track_a.adacnp

# 3 events x 2 arms x 1 seed = 6 planned runs.
# The product is expressed here rather than enumerated so no run count is
# duplicated as a literal in two places.
planned_runs_expansion: events x arms x [seed]

# --- Required per-run manifest fields --------------------------------------
# Every executed run must emit these. Parameter counts are required by the PI
# determination recorded in MODEL_MECHANICS_NOTE_v1.md section 7.3.

run_manifest_fields:
  - run_id
  - event_id
  - arm
  - seed
  - config_sha256
  - input_artifact_sha256
  - context_index_file_sha256
  - trainable_parameter_count
  - derived_fold_count
  - censoring_treatment_applied      # must name the adopted ruling, or fail
  - excluded_verified_shed_hours
  - result_label                     # must be EXPLORATORY at stage 4

# Scaffold baseline for the parameter-count field, measured at the synthetic
# config. Real-data feature dimensionality will change the encoder input width,
# so these are a reference point, not an expectation.
scaffold_parameter_baseline:
  CNP: 110512
  AdaCNP: 123569
  shared_backbone_identical: true
